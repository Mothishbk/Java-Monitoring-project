name: Java Monitoring project

on:
  push:
    branches:
      - main

env:
  APP_NAME: devopsshack-java-demo
  PROJECT_DIR: Java-Monitoring-Project-main

jobs:
  build:
    name: Build Process
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Java-Monitoring-Project-main

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: Java-Monitoring-Project-main/pom.xml

      - name: Test
        run: mvn -B test

      - name: Build
        run: mvn -B package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-jar
          path: ${{ env.PROJECT_DIR }}/target/*.jar
          retention-days: 7

      - name: Upload compiled classes (for Sonar)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: ${{ env.PROJECT_DIR }}/target/classes
          retention-days: 1

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: compiled-classes
          path: ${{ env.PROJECT_DIR }}/target/classes

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master   # pin to a release tag
        with:
          projectBaseDir: ${{ env.PROJECT_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        id: qg
        uses: sonarsource/sonarqube-quality-gate-action@master   # pin to a release tag
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: ${{ env.PROJECT_DIR }}/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Show Quality Gate status
        if: always()
        run: echo "Quality Gate status is ${{ steps.qg.outputs.quality-gate-status }}"
